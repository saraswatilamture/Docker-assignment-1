<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Style Website</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background:#fff;
            color:#111;
        }

        /* Navbar */
        nav{
            background:#000;
            color:#fff;
            padding:15px 50px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        nav h1{
            font-size:24px;
        }

        nav ul{
            display:flex;
            list-style:none;
            gap:25px;
        }

        nav ul li a{
            text-decoration:none;
            color:white;
            font-size:15px;
        }

        nav ul li a:hover{
            color:#ccc;
        }

        /* Hero Section */
        .hero{
            height:90vh;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            text-align:center;
            background:linear-gradient(to bottom, #f5f5f7, #ffffff);
        }

        .hero h2{
            font-size:60px;
            margin-bottom:20px;
        }

        .hero p{
            font-size:24px;
            color:#555;
            margin-bottom:30px;
        }

        .btn{
            padding:12px 28px;
            background:#0071e3;
            color:white;
            border:none;
            border-radius:30px;
            text-decoration:none;
            font-size:18px;
            transition:0.3s;
        }

        .btn:hover{
            background:#005bb5;
        }

        /* Product Section */
        .products{
            padding:60px 50px;
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:30px;
        }

        .card{
            background:#f5f5f7;
            padding:30px;
            border-radius:20px;
            text-align:center;
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-10px);
        }

        .card img{
            width:100%;
            border-radius:15px;
        }

        .card h3{
            margin-top:20px;
            font-size:28px;
        }

        .card p{
            margin-top:10px;
            color:#666;
        }

        /* Footer */
        footer{
            background:#000;
            color:white;
            text-align:center;
            padding:20px;
            margin-top:40px;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav>
        <h1> Apple</h1>

        <ul>
            <li><a href="#">Store</a></li>
            <li><a href="#">Mac</a></li>
            <li><a href="#">iPhone</a></li>
            <li><a href="#">iPad</a></li>
            <li><a href="#">Watch</a></li>
            <li><a href="#">Support</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h2>iPhone 16 Pro</h2>
        <p>Titanium. Powerful. Beautiful.</p>

        <a href="#" class="btn">Buy Now</a>
    </section>

    <!-- Product Section -->
    <section class="products">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=1000" alt="iPhone">
            <h3>iPhone</h3>
            <p>Experience the future.</p>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1517336714739-489689fd1ca8?q=80&w=1000" alt="MacBook">
            <h3>MacBook</h3>
            <p>Supercharged by Apple silicon.</p>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1546868871-7041f2a55e12?q=80&w=1000" alt="Apple Watch">
            <h3>Apple Watch</h3>
            <p>Your health companion.</p>
        </div>

    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 Apple Clone Website</p>
    </footer>

</body>
</html>
