<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Jewellery</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background:#fffaf5;
            color:#333;
        }

        header{
            background:#111;
            color:white;
            padding:20px;
            text-align:center;
        }

        header h1{
            font-size:40px;
            letter-spacing:3px;
        }

        nav{
            margin-top:10px;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:0 15px;
            font-size:18px;
        }

        .hero{
            height:500px;
            background:url('https://images.unsplash.com/photo-1617038260897-41a1f14a8ca0?auto=format&fit=crop&w=1400&q=80') no-repeat center center/cover;
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
            text-shadow:2px 2px 5px black;
        }

        .hero h2{
            font-size:55px;
            background:rgba(0,0,0,0.5);
            padding:20px;
            border-radius:10px;
        }

        .products{
            padding:50px 20px;
            text-align:center;
        }

        .products h2{
            margin-bottom:40px;
            font-size:35px;
            color:#b8860b;
        }

        .product-container{
            display:flex;
            justify-content:center;
            gap:30px;
            flex-wrap:wrap;
        }

        .card{
            background:white;
            width:300px;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-10px);
        }

        .card img{
            width:100%;
            height:300px;
            object-fit:cover;
        }

        .card h3{
            margin:15px 0;
        }

        .price{
            color:#b8860b;
            font-size:22px;
            margin-bottom:15px;
        }

        button{
            background:#b8860b;
            color:white;
            border:none;
            padding:12px 25px;
            margin-bottom:20px;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#8b6508;
        }

        footer{
            background:#111;
            color:white;
            text-align:center;
            padding:20px;
            margin-top:40px;
        }
    </style>
</head>

<body>

<header>
    <h1>Royal Jewellery</h1>

    <nav>
        <a href="#">Home</a>
        <a href="#">Collections</a>
        <a href="#">Gold</a>
        <a href="#">Diamond</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="hero">
    <h2>Elegant Jewellery Collection</h2>
</section>

<section class="products">

    <h2>Featured Products</h2>

    <div class="product-container">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1605100804763-247f67b3557e?auto=format&fit=crop&w=800&q=80">
            <h3>Diamond Necklace</h3>
            <p class="price">₹1,20,000</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1617038220319-276d3cfab638?auto=format&fit=crop&w=800&q=80">
            <h3>Gold Ring</h3>
            <p class="price">₹45,000</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1588444650733-d53f2d1bcb0f?auto=format&fit=crop&w=800&q=80">
            <h3>Luxury Earrings</h3>
            <p class="price">₹35,000</p>
            <button>Buy Now</button>
        </div>

    </div>

</section>

<footer>
    <p>© 2026 Royal Jewellery | All Rights Reserved</p>
</footer>

</body>
</html>
