<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicious Restaurant</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background:#fff8f0;
            color:#333;
        }

        header{
            background:#c0392b;
            color:white;
            text-align:center;
            padding:20px;
        }

        header h1{
            font-size:40px;
            letter-spacing:2px;
        }

        nav{
            margin-top:10px;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:0 15px;
            font-size:18px;
        }

        .hero{
            height:500px;
            background:url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1400&q=80') no-repeat center center/cover;
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
            text-shadow:2px 2px 5px black;
        }

        .hero h2{
            font-size:55px;
            background:rgba(0,0,0,0.5);
            padding:20px;
            border-radius:10px;
        }

        .menu{
            padding:50px 20px;
            text-align:center;
        }

        .menu h2{
            font-size:35px;
            margin-bottom:40px;
            color:#c0392b;
        }

        .menu-container{
            display:flex;
            justify-content:center;
            gap:30px;
            flex-wrap:wrap;
        }

        .card{
            background:white;
            width:300px;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-10px);
        }

        .card img{
            width:100%;
            height:250px;
            object-fit:cover;
        }

        .card h3{
            margin:15px 0;
        }

        .price{
            color:#c0392b;
            font-size:22px;
            margin-bottom:15px;
        }

        button{
            background:#c0392b;
            color:white;
            border:none;
            padding:12px 25px;
            margin-bottom:20px;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#922b21;
        }

        footer{
            background:#c0392b;
            color:white;
            text-align:center;
            padding:20px;
            margin-top:40px;
        }
    </style>
</head>

<body>

<header>
    <h1>Delicious Restaurant</h1>

    <nav>
        <a href="#">Home</a>
        <a href="#">Menu</a>
        <a href="#">Offers</a>
        <a href="#">Gallery</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="hero">
    <h2>Taste The Best Food</h2>
</section>

<section class="menu">

    <h2>Popular Dishes</h2>

    <div class="menu-container">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=800&q=80">
            <h3>Italian Pizza</h3>
            <p class="price">₹499</p>
            <button>Order Now</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=800&q=80">
            <h3>Cheese Burger</h3>
            <p class="price">₹299</p>
            <button>Order Now</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1600891964092-4316c288032e?auto=format&fit=crop&w=800&q=80">
            <h3>Chicken Biryani</h3>
            <p class="price">₹399</p>
            <button>Order Now</button>
        </div>

    </div>

</section>

<footer>
    <p>© 2026 Delicious Restaurant | All Rights Reserved</p>
</footer>

</body>
</html>
