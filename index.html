<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Pharmacy</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background:#f4fff9;
            color:#333;
        }

        header{
            background:#0a8f5b;
            color:white;
            text-align:center;
            padding:20px;
        }

        header h1{
            font-size:40px;
        }

        nav{
            margin-top:10px;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:0 15px;
            font-size:18px;
        }

        .hero{
            height:500px;
            background:url('https://images.unsplash.com/photo-1587854692152-cbe660dbde88?auto=format&fit=crop&w=1400&q=80') no-repeat center center/cover;
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
            text-shadow:2px 2px 5px black;
        }

        .hero h2{
            font-size:50px;
            background:rgba(0,0,0,0.5);
            padding:20px;
            border-radius:10px;
        }

        .products{
            padding:50px 20px;
            text-align:center;
        }

        .products h2{
            font-size:35px;
            margin-bottom:40px;
            color:#0a8f5b;
        }

        .product-container{
            display:flex;
            justify-content:center;
            gap:30px;
            flex-wrap:wrap;
        }

        .card{
            background:white;
            width:300px;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-10px);
        }

        .card img{
            width:100%;
            height:300px;
            object-fit:cover;
        }

        .card h3{
            margin:15px 0;
        }

        .price{
            color:#0a8f5b;
            font-size:22px;
            margin-bottom:15px;
        }

        button{
            background:#0a8f5b;
            color:white;
            border:none;
            padding:12px 25px;
            margin-bottom:20px;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#066d45;
        }

        footer{
            background:#0a8f5b;
            color:white;
            text-align:center;
            padding:20px;
            margin-top:40px;
        }
    </style>
</head>

<body>

<header>
    <h1>HealthCare Pharmacy</h1>

    <nav>
        <a href="#">Home</a>
        <a href="#">Medicines</a>
        <a href="#">Healthcare</a>
        <a href="#">Wellness</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="hero">
    <h2>Your Trusted Online Pharmacy</h2>
</section>

<section class="products">

    <h2>Featured Healthcare Products</h2>

    <div class="product-container">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1584017911766-d451b3d0e843?auto=format&fit=crop&w=800&q=80">
            <h3>Vitamin Tablets</h3>
            <p class="price">₹499</p>
            <button>Order Now</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1603398938378-e54eab446dde?auto=format&fit=crop&w=800&q=80">
            <h3>Health Syrup</h3>
            <p class="price">₹299</p>
            <button>Order Now</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1585435557343-3b092031d4f7?auto=format&fit=crop&w=800&q=80">
            <h3>Medical Kit</h3>
            <p class="price">₹899</p>
            <button>Order Now</button>
        </div>

    </div>

</section>

<footer>
    <p>© 2026 HealthCare Pharmacy | All Rights Reserved</p>
</footer>

</body>
</html>
